
services:
  postgres:
    image: postgres:17-alpine
    container_name: library-db
    environment:
      POSTGRES_DB: library_db_rdnl
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./library_schema.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
